<!--
  TECH GUARDIAN — GLOBAL ELEMENTOR STYLE OVERRIDE
  ================================================
  Drop this into an HTML widget at the TOP of every Elementor page.
  This forces all pages to match the home page's dark, modern design.

  HOW TO USE:
  1. Open any page in Elementor
  2. Add an "HTML" widget at the very top of the page
  3. Paste this entire code block
  4. Publish/Update the page

  Works on: iPhone Screen Repair, Services, FAQ, Contact, Specials, etc.
-->

<style>

.W .elementor-widget-container [style*="#4caf50"],

<!--
  SCROLL ANIMATION SCRIPT
  Adds smooth fade-in-up effect to cards as you scroll.
  Elements with class "animate-in" will animate when they enter viewport.
-->
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Auto-add animation class to key elements
    const animTargets = document.querySelectorAll(
        '.card, .service-card, .repair-card, .pricing-card, ' +
        '.elementor-widget-container, .accent-card, .nap-card'
    );

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.style.opacity = '0';
                entry.target.style.transform = 'translateY(30px)';
                entry.target.style.transition = 'opacity 0.6s ease, transform 0.6s ease';

                setTimeout(() => {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }, 100);

                observer.unobserve(entry.target);
            }
        });
    }, { threshold: 0.1 });

    animTargets.forEach(el => observer.observe(el));
});
</script>
