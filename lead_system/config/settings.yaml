# ============================================================
# Tech Guardian — Lead Monitor configuration
# Edit this file to tune keywords, sources, and search behavior.
# ============================================================

business:
  name: "Tech Guardian"
  city: "Lee's Summit"
  state: "MO"
  metro: "Kansas City"
  phone: ""          # Optional — filled into drafts if set
  website: "https://techguardiankc.com"
  # Cities we will score as "local" for lead ranking.
  local_cities:
    - "Kansas City"
    - "KCMO"
    - "KCK"
    - "Lee's Summit"
    - "Lees Summit"
    - "Independence"
    - "Overland Park"
    - "Olathe"
    - "Blue Springs"
    - "Raytown"
    - "Liberty"
    - "Gladstone"
    - "Shawnee"
    - "Lenexa"
    - "Grandview"
    - "Belton"
    - "Raymore"

# Keywords the matcher looks for in post text/title.
# Case-insensitive. Multi-word phrases are matched as a whole.
keywords:
  primary:
    - "PS5 HDMI"
    - "PS4 HDMI"
    - "Xbox HDMI"
    - "Series X HDMI"
    - "Series S HDMI"
    - "HDMI port"
    - "broken HDMI"
    - "console repair"
    - "game console repair"
  symptom:
    - "no signal"
    - "black screen"
    - "won't display"
    - "wont display"
    - "no display"
    - "no picture"
    - "no video"
    - "bent HDMI"
    - "loose HDMI"
    - "HDMI loose"
    - "HDMI broke"
    - "HDMI not working"
  console:
    - "PS5"
    - "PlayStation 5"
    - "PS4"
    - "PlayStation 4"
    - "Xbox Series X"
    - "Xbox Series S"
    - "Xbox One"
    - "Nintendo Switch"
  intent:
    - "need repair"
    - "looking to fix"
    - "anyone fix"
    - "where to fix"
    - "repair shop"
    - "fix my"
    - "help fix"
    - "how much to fix"
    - "for parts"
    - "broken"
    - "not working"

# Sources. Set enabled: false to skip without deleting config.
sources:
  craigslist:
    enabled: true
    base_url: "https://kansascity.craigslist.org"
    # Craigslist offers an RSS format on search URLs — we use it
    # so we never scrape HTML behind pagination.
    # Sections searched:
    #   sss = for sale (catches "broken PS5 for parts" listings)
    #   wan = wanted (catches "need console HDMI repair")
    search_paths:
      # Broad queries first so the feed almost always has SOMETHING.
      # The keyword matcher filters down aggressively later.
      - "/search/sss?format=rss&query=ps5"
      - "/search/sss?format=rss&query=ps4"
      - "/search/sss?format=rss&query=xbox"
      - "/search/sss?format=rss&query=xbox+series"
      - "/search/sss?format=rss&query=playstation"
      - "/search/sss?format=rss&query=console+broken"
      - "/search/sss?format=rss&query=hdmi"
      - "/search/sss?format=rss&query=console+repair"
      - "/search/wan?format=rss&query=ps5"
      - "/search/wan?format=rss&query=xbox"
      - "/search/wan?format=rss&query=console+repair"
      - "/search/wan?format=rss&query=console+fix"
      - "/search/wan?format=rss&query=hdmi"
    request_delay_seconds: 3.0
    max_items_per_feed: 25

  reddit:
    enabled: true
    # Subreddits to search. Each is queried with every query term.
    subreddits:
      - "kansascity"
      - "kcmo"
      - "leessummit"
      - "playstation"
      - "PS5"
      - "PS4"
      - "xboxone"
      - "XboxSeriesX"
      - "consoles"
      - "gamingsuggestions"
    queries:
      - "HDMI broken"
      - "HDMI port"
      - "no signal"
      - "black screen"
      - "console repair"
      - "won't display"
    time_filter: "month"   # hour|day|week|month|year|all
    limit_per_query: 15
    request_delay_seconds: 2.0

  forum_stub:
    # Clearly stubbed — left in place so you can drop in your own
    # public-forum RSS feeds without changing the main pipeline.
    enabled: false
    feeds: []

  manual:
    # Leads YOU found by hand (Facebook groups, Nextdoor, neighborhood
    # apps, word of mouth). Copy data/manual_leads.csv.template to
    # data/manual_leads.csv and add rows — this source picks them up.
    enabled: true
    file: "data/manual_leads.csv"

  zoho_email:
    # Reads unread Yelp lead emails + Google Voice missed-call emails
    # out of your Zoho inbox via IMAP. Requires ZOHO_EMAIL_USER and
    # ZOHO_APP_PASSWORD in .env (see docs/ZOHO_SETUP.md).
    enabled: true
    imap_host: "imappro.zoho.com"
    imap_port: 993
    folder: "INBOX"
    # Gmail-style search strings (converted to IMAP criteria internally).
    # Add/remove senders and subjects without touching code.
    senders:
      - "noreply@yelp.com"
      - "messaging@yelp.com"
      - "leads@yelp.com"
      - "voice-noreply@google.com"
    subject_includes:
      - "New lead"
      - "New message"
      - "Missed call"
      - "Voicemail"
      - "New quote request"
    max_messages_per_run: 50
    # After processing, move to this folder (created if missing). Set
    # to empty string to leave processed mail in INBOX marked read.
    processed_folder: "Processed-Leads"

# Scoring tunables. Final score is clamped to [1,5].
scoring:
  base: 1
  primary_keyword: 2
  symptom_keyword: 1
  console_keyword: 1
  intent_keyword: 1
  local_city_bonus: 1
  recency_bonus_days: 7
  recency_bonus: 1

# Deduper: where to persist the seen-hash ledger.
deduper:
  ledger_file: "data/seen_hashes.json"

# Storage: CSV is ALWAYS written (it's the audit trail). Google Sheets
# and Airtable are attempted if credentials are configured in .env.
storage:
  csv_file: "data/leads.csv"
  write_sheets: true
  write_airtable: true
  # Airtable table name for leads (must match what you created — see
  # docs/AIRTABLE_SETUP.md). Change here if you used a different name.
  airtable_leads_table: "Leads"

# Profit tracker. Where job rows live locally — they also sync to
# Airtable's Repairs table if AIRTABLE_API_KEY + AIRTABLE_BASE_ID are set.
jobs:
  csv_file: "data/jobs.csv"
  airtable_jobs_table: "Repairs"
  airtable_followups_table: "Lead Follow-Ups"
  daily_revenue_target: 400

# Logging
logging:
  file: "logs/lead_monitor.log"
  max_bytes: 1048576
  backup_count: 5
